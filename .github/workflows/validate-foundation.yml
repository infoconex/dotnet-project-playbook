name: Validate playbook foundation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          git rev-parse HEAD
          python3 --version
          uname -a
      - name: Test documentation validator
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Validate documentation
        run: python3 scripts/validate_docs.py
